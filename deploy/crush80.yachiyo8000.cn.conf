# Crush 80 控制中心：纯静态站点，不代理键盘、不持有账户或设备凭据。
server {
    listen 80;
    listen [::]:80;
    server_name crush80.yachiyo8000.cn;

    root /www/sites/crush80.yachiyo8000.cn/index;
    index index.html;

    access_log /www/sites/crush80.yachiyo8000.cn/log/access.log main;
    error_log /www/sites/crush80.yachiyo8000.cn/log/error.log;

    # 静态站点安全响应头；WebHID 仍由浏览器原生授权弹窗控制。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "hid=(self), usb=(), serial=(), geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; style-src 'self'; script-src 'self'; connect-src 'self'" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.env|\.svn|\.project)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
